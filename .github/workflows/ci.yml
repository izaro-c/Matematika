name: CI Pipeline (Quality Gates)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  NODE_VERSION: 'lts/*'

jobs:
  # lint + typecheck + todos los tests + depcruise + validación de referencias, grafo y cobertura de contenido
  full-check:
    name: Full Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run full project check
        run: npm run full-check

  # Gates específicos del editor que full-check no cubre
  editor-gates:
    name: Editor Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify generated artifacts
        run: npm run editor:generated:check
      - name: Editor lint (warning budget)
        run: npm run editor:lint
      - name: Lossless round-trip gate
        run: npm run editor:roundtrip:check
      - name: Editor safety check
        run: npm run editor:safety:check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: dist/stats.html
          if-no-files-found: error

  coverage-and-reports:
    name: Coverage and Reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run editor coverage
        run: npm run editor:test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: editor-coverage
          path: coverage
          if-no-files-found: error

  final-gate:
    name: Final Gate
    runs-on: ubuntu-latest
    needs:
      - full-check
      - editor-gates
      - build
      - coverage-and-reports
    steps:
      - name: Report success
        run: echo "All required quality gates passed."
